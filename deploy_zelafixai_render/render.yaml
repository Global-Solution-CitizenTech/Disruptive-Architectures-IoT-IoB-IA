services:
  - type: web
    name: zelafix-ai
    runtime: python
    region: oregon
    plan: free
    rootDir: Disruptive-Architectures-IoT-IoB-IA/deploy_zelafixai_render
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: phi-4-multimodal
      - key: AI_EMBEDDING_MODEL
        value: embed-v-4-0
      - key: AI_EMBEDDING_DIMENSIONS
        value: "1536"
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_DSN
        value: oracle.fiap.com.br:1521/orcl
      - key: ORACLE_URL
        value: jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl
