version: '3.8'

services:
  zelafix-ai-iot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zelafix-ai-engine
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - TEMPERATURE=0.2
      - MAX_OUTPUT_TOKENS=1024
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
